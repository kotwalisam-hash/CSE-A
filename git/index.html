<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form>
        <label>Name:</label>
        <input type="text" name="name"><br><br>

        <label>USN:</label>
        <input type="text" name="usn"><br><br>

        <label>Department:</label>
        <select>
            <option>CSE</option>
            <option>ISE</option>
            <option>ECE</option>
            <option>ME</option>
        </select><br><br>

        <label>Year:</label>
        <input type="radio" name="year"> 1st
        <input type="radio" name="year"> 2nd
        <input type="radio" name="year"> 3rd
        <input type="radio" name="year"> 4th
        <br><br>

        <label>Email:</label>
        <input type="email" name="email"><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </form>

</body>
</html>
